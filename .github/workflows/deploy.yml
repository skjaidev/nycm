name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject commit SHA
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, pathlib
          sha = os.environ["COMMIT_SHA"][:7]
          p = pathlib.Path("index.html")
          txt = p.read_text()
          assert "__COMMIT__" in txt, "placeholder not found in index.html"
          p.write_text(txt.replace("__COMMIT__", sha))
          print(f"injected {sha}")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
